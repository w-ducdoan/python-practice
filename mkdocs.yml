site_name: Python Practice
site_description: Python and SQL practice for finance, learned by doing.
site_url: https://w-ducdoan.github.io/python-practice/

theme:
  name: material
  icon:
    logo: material/language-python
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  # Dark is the default; the toggle switches to light. Colors are set in theme.css.
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode

nav:
  - Home: index.md
  - Module 0 - How code runs:
      - module-0/index.md
      - 0.1 Your first program: module-0/0-1-first-program.md
      - 0.2 Reading error messages: module-0/0-2-errors.md
      - Checkpoint 0: module-0/checkpoint.md
  - Module 1 - Values and variables:
      - module-1/index.md
      - 1.1 Numbers and arithmetic: module-1/1-1-numbers.md
      - 1.2 Variables: module-1/1-2-variables.md
      - 1.3 Text and formatting: module-1/1-3-strings.md
      - 1.4 True and False: module-1/1-4-booleans.md
      - 1.5 Capstone - loan payment: module-1/1-5-capstone.md
      - Checkpoint 1: module-1/checkpoint.md
  - Module 2 - Functions and conditionals:
      - module-2/index.md
      - 2.1 Making decisions: module-2/2-1-if.md
      - 2.2 Functions: module-2/2-2-functions.md
      - 2.3 Decisions inside functions: module-2/2-3-decision-functions.md
      - 2.4 Building with functions: module-2/2-4-building.md
      - 2.5 Capstone - covenant tool: module-2/2-5-capstone.md
      - Checkpoint 2: module-2/checkpoint.md
  - Module 3 - Loops, lists and dictionaries:
      - module-3/index.md
      - 3.1 Lists: module-3/3-1-lists.md
      - 3.2 For loops: module-3/3-2-for-loops.md
      - 3.3 Dictionaries: module-3/3-3-dicts.md
      - 3.4 Tables as lists of dicts: module-3/3-4-records.md
      - 3.5 While loops and loop control: module-3/3-5-while.md
      - 3.6 Capstone - amortization schedule: module-3/3-6-capstone.md
      - Checkpoint 3: module-3/checkpoint.md
  - Module 4 - Errors, files and Jupyter:
      - module-4/index.md
      - 4.1 Handling errors: module-4/4-1-errors.md
      - 4.2 Reading and writing files: module-4/4-2-files.md
      - 4.3 Python on your laptop: module-4/4-3-setup.md
      - 4.4 Capstone - trade blotter: module-4/4-4-capstone.md
      - Checkpoint 4: module-4/checkpoint.md
  - Module 5 - NumPy and pandas:
      - module-5/index.md
      - 5.1 NumPy arrays: module-5/5-1-numpy.md
      - 5.2 DataFrames: module-5/5-2-dataframes.md
      - 5.3 Selecting and filtering: module-5/5-3-filtering.md
      - 5.4 Grouping and reshaping: module-5/5-4-grouping.md
      - 5.5 Capstone - portfolio holdings: module-5/5-5-capstone.md
      - Checkpoint 5: module-5/checkpoint.md
  - How this site works: how-it-works.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      # ```exercise blocks render as plain <pre class="exercise">, which exercise.js turns into widgets
      custom_fences:
        - name: exercise
          class: exercise
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      use_pygments: true
  - tables
  - toc:
      permalink: true

# CodeMirror 5 gives the exercise editor syntax coloring and line numbers.
# If the CDN fails, exercise.js falls back to a plain text box.
extra_css:
  - https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css
  - assets/theme.css
  - assets/exercise.css

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/runmode/runmode.min.js
  - assets/exercise.js

# Collects every exercise block into catalog.json so the home page can track progress.
hooks:
  - hooks/catalog.py

